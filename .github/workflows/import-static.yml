name: Import static data (Phase 1)

# Downloads the REAL source files (HDX COD-AB, DOPA villages, Geofabrik OSM)
# from GitHub's runners, imports them into the database given by the
# DATABASE_URL secret, and uploads the raw samples + manifest as an artifact
# so they can be committed to data/samples/.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Sources to fetch (comma list of hdx,dopa,osm)'
        default: 'hdx,dopa,osm'
      build_pmtiles:
        description: 'Also build PMTiles (artifact)'
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - run: npm ci
      - name: Fetch sources
        run: npm run fetch:sources -- --only "${{ inputs.only }}"
      - name: Import into database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run import:all
      - name: Build PMTiles
        if: ${{ inputs.build_pmtiles }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j && sudo make -C /tmp/tippecanoe install
          npm run build:pmtiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samples-and-manifest
          path: |
            data/samples/
            data/static/manifest.json
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.build_pmtiles }}
        with:
          name: pmtiles
          path: data/tiles/
