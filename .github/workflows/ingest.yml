name: Ingest live data

# Pulls live sources (ThaiWater, TMD weather and warnings, Air4Thai, GISTDA flood and PM2.5,
# NASA FIRMS, USGS) into the database every 15 minutes, then refreshes the imagery layers
# (at most twice a day). TMD_UID/TMD_UKEY are optional (TMD's demo account is used without them).
# Requires the DATABASE_URL repository secret; without it the job is skipped.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Single source id (empty = all registered adapters)'
        default: ''

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check database secret
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret not set; skipping."; echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.ready == 'true'
      - name: Apply database migrations
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate
      - name: Ingest
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMD_UID: ${{ secrets.TMD_UID }}
          TMD_UKEY: ${{ secrets.TMD_UKEY }}
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ -n "${{ inputs.source }}" ]; then npm run ingest -- --source "${{ inputs.source }}"; else npm run ingest; fi
      - name: Refresh imagery layers (Sentinel-2 mosaic, SMAP day; skipped when refreshed within 12 h)
        if: steps.check.outputs.ready == 'true' && inputs.source == ''
        # Imagery is a nice-to-have: a failure here must not mark the live ingest as failed.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run refresh:imagery
